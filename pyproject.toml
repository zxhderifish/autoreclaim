[project]
name = "autoreclaim"
version = "0.1.0"
description = "Weekly agent that finds US class-action settlements you qualify for and pre-fills the claims locally."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "zxhderifish" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "cryptography>=43",
    "keyring>=25",
    "tldextract>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/zxhderifish/autoreclaim"
Repository = "https://github.com/zxhderifish/autoreclaim"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autoreclaim*", "onboarding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
